name: CI

# Neither repository had CI before; adding it is a Phase 1 deliverable.
# Typecheck + lint + test must pass before any deploy.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # A real Postgres, so migrations and the integration suite are actually
      # exercised rather than mocked. The schema under test is the schema that
      # ships.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bhw
          POSTGRES_PASSWORD: bhwci
          POSTGRES_DB: bhw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bhw -d bhw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: error
      APP_URL: http://localhost:3001
      DATABASE_URL: postgresql://bhw:bhwci@localhost:5432/bhw
      DATABASE_URL_UNPOOLED: postgresql://bhw:bhwci@localhost:5432/bhw
      FRONTEND_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Secrets are generated per run. They are real 32-byte keys so the boot
      # validation and the crypto suite exercise the production code path, and
      # they are discarded with the runner.
      - name: Generate ephemeral CI secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "BACKEND_API_KEY=$(openssl rand -base64 32)"
            echo "FIELD_ENCRYPTION_KEYS=v1:$(openssl rand -base64 32),v2:$(openssl rand -base64 32)"
            echo "FIELD_ENCRYPTION_KEY_ACTIVE=v1"
          } >> "$GITHUB_ENV"

      - name: Documentation consistency
        run: npm run docs:lint

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrate
        run: npm run migrate

      - name: Seed (stage S1)
        run: npm run seed -- --stage s1

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
